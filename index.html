function render(){document.querySelectorAll('.menu-item').forEach(e=>e.classList.toggle('active',e.dataset.page===state.page));$('#crumb').textContent=({system:'系统配置',campus:'校区配置',teaching:'教学配置',staff:'员工管理'})[state.page]||'待设计';let html='';if(state.page==='system')html=systemPage();else if(state.page==='campus')html=campusPage();else if(state.page==='teaching')html=teachingPage();else if(state.page==='staff')html=staffPage();else html=heading('待设计页面','该模块已列入功能清单，等待详细业务规则和参考图。')+`<div class="card pad"><div class="empty">下一批原型将在这里展开</div></div>`;$('#view').innerHTML=html}
function systemPage(){return heading('系统配置','配置机构资料及业务规则')+`<div class="card"><div class="tabs"><button class="tab active">机构信息</button>${['考勤配置','调课配置','转班配置','进班配置'].map(x=>`<button class="tab" disabled title="功能清单标注为暂未开发">${x}</button>`).join('')}</div><div class="pad"><p class="notice">文档注明其余配置标签暂未开发，原型中以禁用状态展示。</p><h2 class="section-title">机构信息</h2><div class="form-grid"><div class="field"><label class="required">机构名称</label><input class="input" id="org-name" value="苏州思跃培优"></div><div class="field full"><label class="required">机构地址</label><div class="inline"><select class="select"><option>中国大陆</option></select><select class="select"><option>江苏省</option></select><select class="select"><option>苏州市</option></select><select class="select"><option>姑苏区</option></select></div></div><div class="field full"><label>详细地址</label><input class="input" value="人民路18号"></div></div><div class="form-actions"><button class="btn primary" onclick="toast('机构信息已保存（原型演示）')">保存修改</button></div></div></div>`}
function campusPage(){if(state.mode==='form')return campusForm();return heading('校区管理','管理校区、教室和坐席容量')+`<div class="card pad"><div class="toolbar"><div class="toolbar-left"><button class="btn primary" onclick="state.mode='form';state.campusEdit=null;render()">+ 创建校区</button><span class="count">校区总数：${state.campuses.length}</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>校区名称</th><th>教室总数</th><th>坐席总数</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.campuses.map((c,i)=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${c.rooms}</td><td>${c.seats}</td><td><span class="badge ${c.active?'':'off'}">${c.active?'已启用':'已停用'}</span></td><td><div class="actions"><a onclick="state.campusEdit=${i};state.mode='form';render()">编辑</a><a onclick="state.campuses[${i}].active=!state.campuses[${i}].active;render();toast('状态已更新')">${c.active?'停用':'启用'}</a></div></td></tr>`).join('')}</tbody></table></div></div>`}
function campusForm(){let c=state.campusEdit===null?null:state.campuses[state.campusEdit];return heading(c?'编辑校区':'创建校区','校区信息与教室信息')+`<div class="card pad"><h2 class="section-title">校区信息</h2><div class="form-grid"><div class="field"><label class="required">校区名称</label><input id="campus-name" class="input" maxlength="20" placeholder="请输入校区名称" value="${esc(c?.name||'')}"></div><div class="field full"><label class="required">校区地址</label><div class="inline"><select class="select"><option>江苏省</option></select><select class="select"><option>苏州市</option></select><select class="select"><option>姑苏区</option><option>工业园区</option><option>虎丘区</option></select></div></div><div class="field full"><input id="campus-address" class="input" placeholder="请输入详细地址" value="${esc(c?.address?.split(' ').slice(-1)[0]||'')}"></div><div class="field full"><label class="required">收款设置</label><select id="campus-merchant" class="select" style="max-width:430px"><option>苏州思跃教育科技有限公司</option><option>未绑定</option></select><div class="help">未绑定时，请前往“财务中心－收款设置”完成绑定。</div></div></div><div class="form-actions"><button class="btn" onclick="state.mode='list';render()">取消</button><button class="btn primary" onclick="saveCampus()">${c?'保存':'创建'}</button></div><hr class="divider"><div class="subcard-head"><h2 class="section-title" style="margin:0">教室信息</h2><button class="btn" onclick="addRoom()">+ 添加教室</button></div><div id="room-list">${c?`<div class="pill">现有教室 ${c.rooms} 间，坐席 ${c.seats} 个</div>`:'<div class="empty">尚未添加教室</div>'}</div></div>`}
function addRoom(){const list=$('#room-list');if(list.querySelector('.empty'))list.innerHTML='';list.insertAdjacentHTML('beforeend',`<div class="subcard room"><div class="subcard-head"><h3>新教室</h3><button class="btn small danger" onclick="this.closest('.room').remove()">移除</button></div><div class="form-grid"><div class="field"><label class="required">教室名称</label><input class="input room-name" placeholder="例如：A101"></div><div class="field"><label class="required">教室限额</label><input class="input room-capacity" type="number" min="1" placeholder="可容纳人数"></div><div class="field full"><label>教室地址</label><input class="input" placeholder="默认同校区地址，可修改"></div><div class="field full"><label>备注</label><textarea class="textarea" placeholder="选填"></textarea></div></div></div>`)}
function saveCampus(){const name=$('#campus-name').value.trim(),address=$('#campus-address').value.trim();if(!name||!address){toast('请填写校区名称和详细地址');return}let c=state.campusEdit===null?{name,rooms:0,seats:0,active:true}:{...state.campuses[state.campusEdit],name};c.address='江苏省 苏州市 姑苏区 '+address;c.merchant=$('#campus-merchant').value;document.querySelectorAll('.room').forEach(r=>{if(r.querySelector('.room-name').value.trim()){c.rooms++;c.seats+=Number(r.querySelector('.room-capacity').value)||0}});if(state.campusEdit===null)state.campuses.push(c);else state.campuses[state.campusEdit]=c;state.mode='list';render();toast('校区已保存')}
function teachingPage(){const tabs=['学科','难度','学期','年级','班型'];if(!tabs.includes(state.tab))state.tab='学科';let rows=state.config[state.tab]||[];return heading('教学配置','配置课程和班级使用的基础字典')+`<div class="card"><div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t?'active':''}" onclick="state.tab='${t}';state.editing=false;render()">${t}配置</button>`).join('')}</div><div class="pad">${state.tab==='难度'?`<p class="notice">参考截图展示了“难度配置”标签，但功能清单尚未给出字段和选项。</p><div class="empty">等待难度配置规则</div>`:`<div class="toolbar"><div class="toolbar-left"><button class="btn primary" onclick="state.editing=!state.editing;render()">${state.editing?'完成编辑':'修改配置'}</button></div><span class="count">${rows.length} 项</span></div><table class="config-table"><thead><tr><th>${state.tab}</th>${state.editing?'<th>是否展示</th>':''}<th>对外展示内容</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${esc(r[0])}</td>${state.editing?`<td><label class="switch"><input type="checkbox" ${r[1]?'checked':''} onchange="state.config['${state.tab}'][${i}][1]=this.checked"><span></span></label></td>`:''}<td>${state.editing?`<input class="input" style="max-width:300px" value="${esc(r[2])}" oninput="state.config['${state.tab}'][${i}][2]=this.value" ${r[1]?'':'disabled'}>`:r[1]?esc(r[2]):'<span class="muted">不展示</span>'}</td></tr>`).join('')}</tbody></table></div>`}</div>`}
function staffPage(){if(state.mode==='form')return staffForm();return heading('员工管理','管理员工资料、管辖校区与模块权限')+`<div class="card pad"><div class="toolbar"><div class="toolbar-left"><button class="btn primary" onclick="state.mode='form';state.staffEdit=null;render()">+ 创建员工</button></div><div class="toolbar-right"><button class="btn" onclick="toast('导入模板待业务确认')">导入员工</button><button class="btn" onclick="toast('导出功能待业务确认')">导出</button></div></div><div class="filters"><select class="select"><option>全部校区</option><option>城中校区</option><option>园区校区</option></select><select class="select"><option>全部职位</option><option>教务</option><option>招生</option></select><input class="input" placeholder="搜索姓名、电话或邮箱"><select class="select"><option>已启用</option><option>全部状态</option><option>已禁用</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>姓名</th><th>联系电话</th><th>性别</th><th>所属校区</th><th>用户职位</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.staff.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.gender)}</td><td>${esc(s.campus)}</td><td>${esc(s.roles)}</td><td><span class="badge ${s.active?'':'off'}">${s.active?'已启用':'已禁用'}</span></td><td><div class="actions"><a onclick="state.staffEdit=${i};state.mode='form';render()">详情 / 编辑</a><a onclick="state.staff[${i}].active=!state.staff[${i}].active;render()">${s.active?'禁用':'启用'}</a></div></td></tr>`).join('')}</tbody></table></div></div>`}
function staffForm(){let s=state.staffEdit===null?null:state.staff[state.staffEdit];return heading(s?'编辑员工':'创建员工','填写基本信息并配置校区、职位与权限')+`<div class="card pad"><h2 class="section-title">基本信息</h2><div class="form-grid"><div class="field"><label class="required">姓名</label><input id="staff-name" class="input" placeholder="请输入姓名" value="${esc(s?.name||'')}"></div><div class="field"><label class="required">手机号（用于登录）</label><input id="staff-phone" class="input" placeholder="请输入手机号码" value="${esc(s?.phone||'')}"><div class="help">手机号将作为登录账号。</div></div><div class="field"><label>性别</label><select id="staff-gender" class="select"><option>男</option><option ${s?.gender==='女'?'selected':''}>女</option></select></div><div class="field"><label>员工头像</label><input type="file" accept="image/png,image/jpeg" class="input"><div class="help">支持 JPG、PNG，文件不超过 2MB。</div></div></div><hr class="divider"><h2 class="section-title">管辖校区</h2><div class="checkrow"><label><input type="radio" name="campus-scope" checked> 全部校区</label><label><input type="radio" name="campus-scope"> 指定校区</label></div><h2 class="section-title">职位管理</h2><div class="checkrow">${['校区主管','财务','教务','前台','招生','学管师','课程顾问','教学管理','面授（直播）主讲'].map(x=>`<label><input type="checkbox" class="role" value="${x}" ${s?.roles?.includes(x)?'checked':''}> ${x}</label>`).join('')}</div><h2 class="section-title">模块权限</h2>${[['线索与业务','线索查看','线索分配','报名','转课/班','退课/班'],['教务中心','学生管理','课程管理','班级管理','课表','考勤','补课管理'],['财务中心','收费订单','欠费记录','退转记录','收款设置'],['基础设置','校区配置','教学配置','员工管理']].map(g=>`<div class="permission-block"><h3>${g[0]}</h3><div class="checkrow">${g.slice(1).map(x=>`<label><input type="checkbox"> ${x}</label>`).join('')}</div></div>`).join('')}<div class="form-actions"><button class="btn" onclick="state.mode='list';render()">取消</button><button class="btn primary" onclick="saveStaff()">${s?'保存':'创建'}</button></div></div>`}
function saveStaff(){let name=$('#staff-name').value.trim(),phone=$('#staff-phone').value.trim();if(!name||!phone){toast('请填写姓名和手机号');return}let roles=[...document.querySelectorAll('.role:checked')].map(x=>x.value).join('、')||'未配置';let s={name,phone,gender:$('#staff-gender').value,campus:'全部校区',roles,active:true};if(state.staffEdit===null)state.staff.push(s);else state.staff[state.staffEdit]={...state.staff[state.staffEdit],...s};state.mode='list';render();toast('员工信息已保存')}
document.querySelectorAll('.menu-item').forEach(e=>e.addEventListener('click',()=>{state.page=e.dataset.page;state.mode='list';state.editing=false;render()}));render();
</script>
