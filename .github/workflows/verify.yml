name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - run: node --test backend/test/*.test.cjs
      - run: node --test frontend-tests/*.test.cjs frontend-tests/*.test.mts
      - run: node --test deploy/aliyun/test.cjs
      - run: python3 -m unittest discover -s deploy/aliyun -p 'test_production*.py' -v
  legacy-demo-compatibility:
    # The original offline demo harness lacks DOM APIs used by the live UI.
    # Keep its result visible until the harness is migrated; never use it as
    # evidence that the authenticated production flows were verified.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/run.cjs
      - name: Legacy CLI, MCP and packaging compatibility
        if: always()
        run: node --test cli/*.test.cjs mcp/server.test.cjs scripts/build-tools.test.cjs
